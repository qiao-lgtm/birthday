<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快樂大冒險！</title>
    <!-- 引入彩帶特效的套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 450px;
            width: 90%;
            margin: 20px;
        }

        h2 {
            color: #ff6b6b;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #ff5252;
            transform: scale(1.05);
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 1rem;
            border: 2px solid #ffb8b8;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #ff6b6b;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 5px;
            min-height: 20px;
        }

        .hidden {
            display: none;
        }

        .wish-box {
            font-size: 1rem;
            color: #333;
            background: #fff5f5;
            padding: 20px;
            border-radius: 10px;
            border: 2px dashed #ffb8b8;
            text-align: left;
            line-height: 1.6;
        }

        .wish-box ul {
            margin: 5px 0 15px 0;
            padding-left: 20px;
            color: #e65c5c;
        }
    </style>
</head>
<body>

    <div class="card" id="game-card">
        <!-- 第 1 層 -->
        <div id="step-1" class="step">
            <h2>🎁 發現一個神秘禮物！</h2>
            <p>這好像是一個專屬於你的生日驚喜，要把它打開嗎？</p>
            <button class="btn" onclick="nextStep(2)">點擊打開第一層</button>
        </div>

        <!-- 第 2 層：問日期互動 -->
        <div id="step-2" class="step hidden">
            <h2>✨ 考驗你的記憶力！</h2>
            <p>請問今天（或是一個對你很重要的日子）是幾月幾號呢？<br><small>（格式例如：0618 或 6月18日）</small></p>
            <input type="text" id="date-input" placeholder="請輸入日期...">
            <br>
            <button class="btn" onclick="checkDate()">送出答案</button>
            <div id="date-error" class="error-msg"></div>
        </div>

        <!-- 第 3 層：許願互動 -->
        <div id="step-3" class="step hidden">
            <h2>🌟 許願時間到！</h2>
            <p>快向星星許下三個願望吧！</p>
            <input type="text" id="wish-1" placeholder="第 1 個願望..."><br>
            <input type="text" id="wish-2" placeholder="第 2 個願望..."><br>
            <input type="text" id="wish-3" placeholder="第 3 個願望..."><br>
            <button class="btn" onclick="saveWishes()">許願完畢，看驚喜！</button>
        </div>

        <!-- 第 4 層：最後的祝福語 -->
        <div id="step-4" class="step hidden">
            <h2>🎂 生日快樂！</h2>
            <div class="wish-box">
                <small style="color: #888;">✨ 你剛剛許下的願望：</small>
                <ul>
                    <li id="display-w1"></li>
                    <li id="display-w2"></li>
                    <li id="display-w3"></li>
                </ul>
                <hr style="border: 0; border-top: 1px dashed #ffb8b8; margin: 12px 0;">
                
                <!-- 你的專屬祝福 -->
                <strong>To：大忙人芊妤🫶</strong><br>
                祝你生日快樂～恭喜17歲啦！<br>
                希望你每天都開開心心的喔，不管是生研、CET、合唱團都順順利利。課業也順順，如果當初去問你這個生物電神⚡️生物怎麼學好的我可能就跑去四類不會在這裡搞程式了（雖然也不是我寫的）哈哈。<br>
                記得不要內耗啊～你是最棒棒棒棒的！<br><br>
                <div style="text-align: right; font-weight: bold; color: #ff6b6b;">HAPPY BIRTHDAY 🎉🎈</div>
            </div>
            <br>
            <button class="btn" onclick="resetGame()">再玩一次</button>
        </div>
    </div>

    <script>
        function nextStep(stepNumber) {
            const steps = document.querySelectorAll('.step');
            steps.forEach(step => step.classList.add('hidden'));
            document.getElementById('step-' + stepNumber).classList.remove('hidden');

            // 如果到了最後一頁，觸發彩帶特效！
            if (stepNumber === 4) {
                triggerConfetti();
            }
        }

        function checkDate() {
            const inputVal = document.getElementById('date-input').value.trim();
            const errorDiv = document.getElementById('date-error');

            if (inputVal === "") {
                errorDiv.textContent = "請輸入日期喔！";
                return;
            }

            errorDiv.textContent = "";
            nextStep(3);
        }

        function saveWishes() {
            const w1 = document.getElementById('wish-1').value;
            const w2 = document.getElementById('wish-2').value;
            const w3 = document.getElementById('wish-3').value;

            document.getElementById('display-w1').textContent = w1 ? w1 : "（沒填寫願望，但一定會實現！）";
            document.getElementById('display-w2').textContent = w2 ? w2 : "（心想事成！）";
            document.getElementById('display-w3').textContent = w3 ? w3 : "（快樂每一天！）";

            nextStep(4);
        }

        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function resetGame() {
            document.getElementById('date-input').value = "";
            document.getElementById('wish-1').value = "";
            document.getElementById('wish-2').value = "";
            document.getElementById('wish-3').value = "";
            document.getElementById('date-error').textContent = "";
            nextStep(1);
        }
    </script>

</body>
</html>
